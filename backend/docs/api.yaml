openapi: 3.0.3
info:
  title: 智慧记账应用 API
  description: 智慧记账应用后端 API 接口规范
  version: 1.0.0
  contact:
    name: 开发团队
    email: dev@example.com

servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发环境
  - url: https://api.example.com/api/v1
    description: 生产环境

tags:
  - name: 认证
    description: 用户认证相关接口
  - name: 用户
    description: 用户信息管理
  - name: 账户
    description: 账户管理
  - name: 分类
    description: 分类管理
  - name: 账目
    description: 记账流水管理
  - name: 预算
    description: 预算管理
  - name: 报表
    description: 报表分析
  - name: 资产
    description: 资产管理

paths:
  /auth/register:
    post:
      tags: [认证]
      summary: 用户注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, phone, password, nickname]
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
                password:
                  type: string
                  minLength: 6
                nickname:
                  type: string
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      tags: [认证]
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                phone:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Error"

  /auth/refresh:
    post:
      tags: [认证]
      summary: 刷新 Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "401":
          $ref: "#/components/responses/Error"

  /users/me:
    get:
      tags: [用户]
      summary: 获取当前用户信息
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      tags: [用户]
      summary: 更新用户信息
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                avatar_url:
                  type: string
                currency:
                  type: string
                timezone:
                  type: string
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /accounts:
    get:
      tags: [账户]
      summary: 获取账户列表
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      tags: [账户]
      summary: 创建账户
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /accounts/{id}:
    get:
      tags: [账户]
      summary: 获取账户详情
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
    put:
      tags: [账户]
      summary: 更新账户
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                currency:
                  type: string
                icon:
                  type: string
                color:
                  type: string
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
    delete:
      tags: [账户]
      summary: 删除账户
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 删除成功

  /accounts/total/balance:
    get:
      tags: [账户]
      summary: 获取总余额
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_balance:
                    type: number

  /categories:
    get:
      tags: [分类]
      summary: 获取分类列表
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      tags: [分类]
      summary: 创建分类
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/tree:
    get:
      tags: [分类]
      summary: 获取分类树
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /categories/{id}:
    put:
      tags: [分类]
      summary: 更新分类
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                icon:
                  type: string
                color:
                  type: string
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      tags: [分类]
      summary: 删除分类
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 删除成功

  /transactions:
    get:
      tags: [账目]
      summary: 获取账目列表
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      tags: [账目]
      summary: 创建账目
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreate"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/{id}:
    get:
      tags: [账目]
      summary: 获取账目详情
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
    put:
      tags: [账目]
      summary: 更新账目
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                merchant:
                  type: string
                note:
                  type: string
                bill_date:
                  type: string
                  format: date-time
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
    delete:
      tags: [账目]
      summary: 删除账目
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 删除成功

  /transactions/batch-delete:
    post:
      tags: [账目]
      summary: 批量删除账目
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "204":
          description: 删除成功

  /budgets:
    get:
      tags: [预算]
      summary: 获取预算列表
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Budget"
    post:
      tags: [预算]
      summary: 创建预算
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetCreate"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"

  /budgets/{id}/progress:
    get:
      tags: [预算]
      summary: 获取预算进度
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  spent:
                    type: number
                  budget_amount:
                    type: number
                  progress:
                    type: number

  /reports/summary:
    get:
      tags: [报表]
      summary: 获取收支摘要
      security:
        - bearerAuth: []
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_income:
                    type: number
                  total_expense:
                    type: number
                  balance:
                    type: number

  /reports/trend:
    get:
      tags: [报表]
      summary: 获取收支趋势
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [day, week, month, year]
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                    income:
                      type: number
                    expense:
                      type: number

  /assets:
    get:
      tags: [资产]
      summary: 获取资产列表
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetChange"
    post:
      tags: [资产]
      summary: 创建资产记录
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetChangeCreate"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetChange"

  /assets/summary:
    get:
      tags: [资产]
      summary: 获取资产汇总
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: 错误响应
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        phone:
          type: string
        nickname:
          type: string
        avatar_url:
          type: string
        currency:
          type: string
        timezone:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        balance:
          type: number
        currency:
          type: string
        icon:
          type: string
        color:
          type: string
        is_default:
          type: boolean
        sort_order:
          type: integer

    AccountCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        currency:
          type: string
        icon:
          type: string
        color:
          type: string
        is_default:
          type: boolean

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        type:
          type: string
        sort_order:
          type: integer
        is_system:
          type: boolean
        children:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    CategoryCreate:
      type: object
      required: [name, type]
      properties:
        parent_id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        type:
          type: string

    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        target_account_id:
          type: string
          format: uuid
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
        amount:
          type: number
        currency:
          type: string
        exchange_rate:
          type: number
        tags:
          type: array
          items:
            type: string
            format: uuid
        merchant:
          type: string
        note:
          type: string
        bill_date:
          type: string
          format: date-time
        is_recurring:
          type: boolean
        account:
          $ref: "#/components/schemas/Account"
        category:
          $ref: "#/components/schemas/Category"

    TransactionCreate:
      type: object
      required: [account_id, type, amount, bill_date]
      properties:
        account_id:
          type: string
          format: uuid
        target_account_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        type:
          type: string
        amount:
          type: number
        currency:
          type: string
        exchange_rate:
          type: number
        tags:
          type: array
          items:
            type: string
            format: uuid
        merchant:
          type: string
        note:
          type: string
        bill_date:
          type: string
          format: date-time
        is_recurring:
          type: boolean
        recurring_rule:
          type: string

    Budget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          nullable: true
        amount:
          type: number
        period:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        alert_threshold:
          type: number

    BudgetCreate:
      type: object
      required: [amount, period, start_date]
      properties:
        category_id:
          type: string
          format: uuid
        amount:
          type: number
        period:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        alert_threshold:
          type: number

    AssetChange:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        asset_type:
          type: string
        related_user:
          type: string
        name:
          type: string
        amount:
          type: number
        interest_rate:
          type: number
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
        note:
          type: string

    AssetChangeCreate:
      type: object
      required: [asset_type, name, amount]
      properties:
        asset_type:
          type: string
        related_user:
          type: string
        name:
          type: string
        amount:
          type: number
        interest_rate:
          type: number
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        note:
          type: string
